server {
    listen 80;
    server_name localhost;  # Replace with your domain or use localhost for testing

    # Serve React static files
    root /usr/share/nginx/html;  # This is where Nginx will look for the build directory
    index index.html;

    # For any request, try serving the static files, if not, serve index.html (for React Router handling)
    location / {
        try_files $uri /index.html;
    }

    # API requests (forward to the backend on port 8080)
    location /api/ {
        proxy_pass http://backend:8080;  # Proxy to the backend service (Node.js app)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

